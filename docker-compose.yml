version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: noteai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: noteai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noteai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteai_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/noteai_db
      - SECRET_KEY=noteai_super_secret_jwt_key_2026_safe_auth_token_987654
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_VISION_API_KEY=${GROQ_VISION_API_KEY}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_MODEL=${SARVAM_MODEL:-sarvam-105b-conversations}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
